<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icebreaker Energy Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #040507;
            --panel: #0b0e13;
            --line: rgba(255, 255, 255, 0.09);
            --text: #f5f7fb;
            --muted: #99a3b5;
            --ice: #dff7ff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: min(960px, calc(100% - 32px));
            margin: 0 auto;
        }

        .shell {
            padding: 32px 0 72px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(18px);
            background: rgba(4, 5, 7, 0.82);
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand,
        .back-link {
            color: var(--text);
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.4rem, 7vw, 4.6rem);
            line-height: 0.92;
            text-transform: uppercase;
            letter-spacing: -0.05em;
        }

        .intro {
            margin-top: 18px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
            max-width: 60ch;
        }

        .post-grid {
            display: grid;
            gap: 16px;
            margin-top: 32px;
        }

        .post-card {
            display: block;
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
            color: inherit;
            text-decoration: none;
        }

        .post-date {
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .post-card h2 {
            margin: 12px 0 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.55rem;
            line-height: 1;
            text-transform: uppercase;
        }

        .post-card p {
            margin: 12px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        @media (max-width: 560px) {
            .container {
                width: min(100% - 32px, 960px);
            }

            .shell {
                padding: 24px 0 48px;
            }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="../index.html">Icebreaker</a>
            <a class="back-link" href="../index.html#blog">Back to site</a>
        </div>
    </nav>

    <main class="shell">
        <div class="container">
            <h1>Icebreaker Blog</h1>
            <p class="intro">Technical writing on cooling, thermal storage, peak demand, and the grid.</p>
            <div class="post-grid" id="post-grid"></div>
        </div>
    </main>

    <script>
        async function loadPosts() {
            const response = await fetch('./posts.json');
            const posts = await response.json();
            const grid = document.getElementById('post-grid');

            grid.innerHTML = posts.map((post) => `
                <a class="post-card" href="./post.html?slug=${encodeURIComponent(post.slug)}">
                    <div class="post-date">${post.date}</div>
                    <h2>${post.title}</h2>
                    <p>${post.excerpt}</p>
                </a>
            `).join('');
        }

        loadPosts();
    </script>
</body>
</html>
